name: Flutter 检查

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  flutter-checks:
    name: 静态分析与测试
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: 安装系统 SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - name: 安装依赖
        run: flutter pub get --enforce-lockfile
      - name: 静态分析
        run: flutter analyze
      - name: 自动化测试
        run: flutter test --timeout 180s
